# ============================================================
# WorkLoom IM · 基座能力心跳对齐（base-sync heartbeat · 子仓侧）
#
# 这是子仓模板——由 workloom-im/sync/adopt.sh 注入，不要手工改本文件逻辑；
# 引擎与范围声明始终从基座仓 main 拉取最新版（防副本漂移），本文件只是触发器。
#
# 触发：每日定时（错峰）+ 手动 + push 后自检
# 行为：只读检测并报告漂移。行业仓不持有跨仓写凭据，也不直推 main；
#       基座 ci-gate 成功后由基座仓统一创建升级 PR。
# ============================================================
name: base-sync-heartbeat

on:
  schedule:
    - cron: "__CRON__"          # adopt.sh 按仓名哈希错峰生成，避免 7+ 仓同时打 API
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  BASE_REPO: geniusdapeng-collab/workloom-im

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 拉取最新 base-sync 引擎（始终基座 main 版）
        run: |
          mkdir -p /tmp/base-sync/sync
          curl -fsSL "https://raw.githubusercontent.com/${BASE_REPO}/main/sync/base-sync.mjs" -o /tmp/base-sync/sync/base-sync.mjs
          echo "引擎就绪：$(wc -l < /tmp/base-sync/sync/base-sync.mjs) 行"

      - name: 心跳检测（只读）
        id: sync
        run: |
          set +e
          node /tmp/base-sync/sync/base-sync.mjs detect --repo __REPO_DIR__ --dry-run 2>&1 | tee /tmp/detect.log
          CODE=$?
          set -e
          if [ "$CODE" = "0" ]; then
            echo "result=aligned" >> $GITHUB_OUTPUT
          else
            echo "result=behind" >> $GITHUB_OUTPUT
            echo "## ⚠️ 基座能力落后" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/detect.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "处理：等待 WorkLoom IM 的 ci-gate 通过后由基座仓创建升级 PR；本工作流绝不写入主分支。" >> $GITHUB_STEP_SUMMARY
            exit 2
          fi
