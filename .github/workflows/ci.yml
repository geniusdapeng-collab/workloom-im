# ============================================================
# WorkLoom CI 质量门禁（审计第 5 轮接入）
# 触发：push / PR to main
# 内容：typecheck + 三包测试（含 DB 集成）+ 全场景套件（326 用例）+ dsh-gate E6
# 注意：DB 集成测试必须真实 PG（RUN_DB_TESTS=1）——0.1.1 前全部 skip 曾掩盖 P0（#22）
# ============================================================
name: ci-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workloom
          POSTGRES_DB: workloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:workloom@localhost:5432/workloom
      DATABASE_APP_URL: postgres://workloom_app:workloom_dev_app@localhost:5432/workloom
      DATABASE_GATEWAY_URL: postgres://workloom_gateway:workloom_dev_gateway@localhost:5432/workloom
      APP_DB_PASSWORD: workloom_dev_app
      GATEWAY_DB_PASSWORD: workloom_dev_gateway
      JWT_SECRET: ci-gate-secret
      LLM_PROVIDER: mock
      IM_DRIVER: mock
      RUN_DB_TESTS: "1"
      TOOL_UNVERIFIED_RATE: "0"
      RELEASE_WORKSPACE_ID: ws-aipm-demo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate

      - name: 基座代码增量秘密扫描
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse --verify HEAD^{commit})"
          git rev-parse --verify "${EVENT_BASE_SHA}^{commit}" >/dev/null
          BASE_SHA="$(git merge-base "$EVENT_BASE_SHA" "$HEAD_SHA")"
          test -n "$BASE_SHA"
          node scripts/secret-scan.mjs --self-test
          node scripts/secret-scan.mjs --range "$BASE_SHA" "$HEAD_SHA" --acceptance-manifest sync/base-scope.json

      - name: 依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck 全包
        run: pnpm -r --if-present typecheck

      - name: 三端 UI 同源与新行业接入门禁
        run: |
          pnpm product:verify
          pnpm bundle:governance:test
          pnpm bundle:governance
          pnpm projections:check
          pnpm ui:governance
          pnpm -C packages/industry-contract test
          pnpm -C packages/industry-contract build
          pnpm -C packages/ui test
          pnpm -C packages/ui build
          node --test scripts/verify-ui-consumer.test.mjs sync/base-sync.test.mjs sync/client-foundation.test.mjs sync/set-ui-version.test.mjs sync/ui-upgrade-pr.test.mjs
          node --test apps/desktop/electron/bootstrap.test.cjs scripts/desktop-bootstrap-db.test.mjs

      - name: 迁移 + 种子（H-1 完整率 100%）
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm db:seed:aipm
          pnpm db:seed:aipm:verify-idempotence
          # 既有 326 项引擎集成套件使用 hotel 作为受控测试夹具；不进入桌面出厂数据。
          BUNDLE_DIR=bundles/hotel pnpm db:seed
          BUNDLE_DIR=bundles/hotel pnpm db:seed # 行业夹具同库复跑，验证事件物理序列与幂等

      - name: 哈希链全库验证（#32 口径）
        run: pnpm db:verify-chain

      - name: shared/base/runtime 测试（DB 集成全开）
        run: |
          pnpm -C packages/shared test
          pnpm -C packages/base test
          pnpm -C packages/runtime test

      - name: server 契约与 E2E（显式 hotel 测试夹具）
        env:
          SERVICE_C_TEST_WORKSPACE_ID: ws-yunqi
        run: pnpm -C apps/server test

      - name: 全场景套件（326 用例）
        run: pnpm suite

      - name: 三端生产构建
        run: |
          pnpm -C apps/web build
          pnpm -C apps/webb build
          pnpm -C apps/webc build

      - name: 安装三端视觉门禁浏览器
        run: pnpm exec playwright install --with-deps chromium

      - name: 三端响应式、视觉与无障碍门禁
        run: pnpm ui:e2e

      - name: 留存三端视觉与无障碍证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workloom-ui-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results/ui
          if-no-files-found: warn
          retention-days: 30

      - name: dsh-gate E6（围栏瀑布 + 事件桥 + H-5 崩溃重放）
        run: bash scripts/dsh-gate.sh
