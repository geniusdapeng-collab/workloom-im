# ui-v* 只封存共享 UI 与三端客户端基座；行业 Bundle 使用独立发布生命周期。
name: shared-ui-client-foundation-release

on:
  push:
    tags:
      - "ui-v*"
  workflow_dispatch:
    inputs:
      action:
        description: "只做下游盘点，或对已发布稳定版继续下一波 rollout"
        required: true
        type: choice
        options: [preflight, rollout]
        default: preflight
      stable_version:
        description: "仅手动 rollout 使用：已发布稳定版本，如 1.2.3；只读盘点默认检查当前候选版"
        required: false
        type: string
      wave:
        description: "可选波次 W1/W2/W3A/W3B/W4/W5；留空自动选择最早未完成波次"
        required: false
        type: string
      repositories:
        description: "可选同波次仓白名单，逗号分隔；不得越过未完成的前序波次"
        required: false
        type: string

concurrency:
  group: shared-ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      release-version: ${{ steps.release-target.outputs.version }}
      release-tag: ${{ steps.release-target.outputs.tag }}
      release-sha: ${{ steps.release-target.outputs.sha }}
      stable-target: ${{ steps.release-target.outputs.stable }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workloom
          POSTGRES_DB: workloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:workloom@localhost:5432/workloom
      DATABASE_APP_URL: postgres://workloom_app:workloom_dev_app@localhost:5432/workloom
      DATABASE_GATEWAY_URL: postgres://workloom_gateway:workloom_dev_gateway@localhost:5432/workloom
      APP_DB_PASSWORD: workloom_dev_app
      GATEWAY_DB_PASSWORD: workloom_dev_gateway
      JWT_SECRET: ui-release-gate-secret
      LLM_PROVIDER: mock
      IM_DRIVER: mock
      RUN_DB_TESTS: "1"
      TOOL_UNVERIFIED_RATE: "0"
      RELEASE_WORKSPACE_ID: ws-aipm-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 固定验证对象并证明稳定标签来自 main
        id: release-target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          REQUESTED_ACTION: ${{ inputs.action }}
          REQUESTED_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          TARGET_TAG=""
          if [ "$EVENT_NAME" = "push" ] && [[ "$PUSH_REF" == refs/tags/ui-v* ]]; then
            TARGET_TAG="$PUSH_REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REQUESTED_ACTION" = "rollout" ]; then
            [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "❌ 手动 rollout 必须指定精确稳定版本 stable_version（如 1.2.3）"
              exit 1
            }
            TARGET_TAG="ui-v$REQUESTED_VERSION"
          fi

          if [ -z "$TARGET_TAG" ]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse --verify HEAD^{commit})" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${TARGET_TAG#ui-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "❌ 非法稳定 UI 标签：$TARGET_TAG"
            exit 1
          }
          TARGET_SHA="$(git rev-parse --verify "refs/tags/${TARGET_TAG}^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main || {
            echo "❌ $TARGET_TAG 不属于 origin/main 历史；拒绝以旁路标签发布或 rollout"
            exit 1
          }
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_SHA"
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "✅ 验证对象已固定：$TARGET_TAG @ ${TARGET_SHA:0:12}（origin/main 祖先）"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: 固定生成不可变制品的 npm CLI
        run: npm install --global --ignore-scripts npm@11.6.2
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile

      # UI 标签不得临时改写 Bundle 为 stable。这里仅校验仓内候选清单、摘要与
      # 已提交行业投影一致；生产 Bundle 的签名、公钥环和制品留存由独立流程负责。
      - name: 候选 Bundle 契约、摘要与投影一致性门禁
        run: pnpm product:verify && pnpm bundle:governance && pnpm projections:check
      - run: pnpm ui:governance
      - run: pnpm -C packages/industry-contract test && pnpm -C packages/industry-contract build
      - run: pnpm -C packages/ui test && pnpm -C packages/ui build
      - run: node --test scripts/verify-ui-consumer.test.mjs sync/base-sync.test.mjs sync/client-foundation.test.mjs sync/set-ui-version.test.mjs sync/ui-upgrade-pr.test.mjs

      - name: 基座数据库、全场景与三端生产门禁
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm db:seed:aipm
          pnpm db:seed:aipm:verify-idempotence
          BUNDLE_DIR=bundles/hotel pnpm db:seed
          pnpm suite
          pnpm -C apps/web build
          pnpm -C apps/webb build
          pnpm -C apps/webc build
          pnpm exec playwright install --with-deps chromium
          pnpm ui:e2e

      - name: 留存稳定发布三端视觉与无障碍证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workloom-ui-release-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results/ui
          if-no-files-found: warn
          retention-days: 30

      - name: 发布前核心链路门禁
        run: |
          pnpm -C apps/server start > "$RUNNER_TEMP/workloom-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health >/dev/null
          pnpm release:gate

      - name: 校验 UI 标签、稳定版本登记与 GitHub Release 分发契约
        if: steps.release-target.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.release-target.outputs.version }}
        run: |
          node -e 'const fs=require("fs"); const v=process.argv[1]; const p=JSON.parse(fs.readFileSync("packages/ui/package.json")); const m=JSON.parse(fs.readFileSync("sync/base-capabilities.json")); const d=m.ui?.distribution; const expectedUrl="https://github.com/geniusdapeng-collab/workloom-im/releases/download/ui-v{version}/workloom-ui-{version}.tgz"; if(p.version!==v||m.ui?.latestStableVersion!==v||m.clientFoundation?.latestStableVersion!==v) throw new Error(`版本不一致: tag=${v}, package=${p.version}, uiStable=${m.ui?.latestStableVersion}, clientStable=${m.clientFoundation?.latestStableVersion}`); if(p.private!==true||p.publishConfig!==undefined) throw new Error("@workloom/ui 必须关闭第三方 registry 发布通道"); if(d?.type!=="github-release-tarball"||d?.urlTemplate!==expectedUrl||d?.assetNameTemplate!=="workloom-ui-{version}.tgz") throw new Error("@workloom/ui 必须固定 GitHub Release tarball 分发契约"); if(!/^sha512-[A-Za-z0-9+/]{86}==$/.test(d?.integrityByVersion?.[v]??"")) throw new Error(`缺少 ${v} 的 sha512 SRI 登记`)' "$VERSION"
          node sync/client-foundation.mjs verify-source --version "$VERSION"

      - name: 八个下游仓访问与迁移现状只读预检
        env:
          REPORT_PATH: ${{ runner.temp }}/ui-downstream-preflight.json
          STABLE_VERSION: ${{ steps.release-target.outputs.version }}
        run: |
          set -euo pipefail
          ARGS=(--preflight --report "$REPORT_PATH")
          [ -n "$STABLE_VERSION" ] && ARGS+=(--version "$STABLE_VERSION")
          node sync/ui-upgrade-pr.mjs "${ARGS[@]}"

      - name: 留存下游访问与迁移现状
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-downstream-preflight
          path: ${{ runner.temp }}/ui-downstream-preflight.json
          if-no-files-found: warn
          retention-days: 30

      - name: 生成待发布的不可变 UI 制品
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ui-v')
        env:
          VERSION: ${{ steps.release-target.outputs.version }}
        run: |
          pnpm -C packages/ui run prepack
          mkdir -p "$RUNNER_TEMP/ui-package"
          cd packages/ui
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/ui-package" > "$RUNNER_TEMP/ui-package/pack-metadata.json"
          cd "$GITHUB_WORKSPACE"
          node -e 'const fs=require("fs"); const v=process.argv[1]; const dir=process.argv[2]; const meta=JSON.parse(fs.readFileSync(`${dir}/pack-metadata.json`)); const manifest=JSON.parse(fs.readFileSync("sync/base-capabilities.json")); const expected=`workloom-ui-${v}.tgz`; if(!Array.isArray(meta)||meta.length!==1||meta[0]?.filename!==expected) throw new Error(`npm pack 必须且只能生成 ${expected}`); const registered=manifest.ui?.distribution?.integrityByVersion?.[v]; if(!registered||meta[0]?.integrity!==registered) throw new Error(`pack integrity 与 ${v} 的受控 manifest 登记不一致`)' "$VERSION" "$RUNNER_TEMP/ui-package"

      - name: 留存待发布 UI 制品
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ui-v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workloom-ui-package
          path: ${{ runner.temp }}/ui-package
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ui-v')
    needs: verify-and-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workloom-ui-package
          path: ${{ runner.temp }}/ui-package

      - name: 发布或逐字节核验 GitHub Release 稳定制品
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify-and-preflight.outputs.release-version }}
          RELEASE_TAG: ${{ needs.verify-and-preflight.outputs.release-tag }}
          RELEASE_SHA: ${{ needs.verify-and-preflight.outputs.release-sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "ui-v$VERSION"
          test -n "$RELEASE_SHA"
          EXPECTED_ASSET="workloom-ui-${VERSION}.tgz"
          mapfile -t TARBALLS < <(find "$RUNNER_TEMP/ui-package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "❌ 待发布 tarball 数量必须为 1"; exit 1; }
          TARBALL="${TARBALLS[0]}"
          test "$(basename "$TARBALL")" = "$EXPECTED_ASSET"
          LOCAL_INTEGRITY="$(node -e 'const fs=require("fs"),c=require("crypto"); process.stdout.write(`sha512-${c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`)' "$TARBALL")"
          PACK_INTEGRITY="$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.argv[1])); if(!Array.isArray(m)||m.length!==1||!m[0].integrity) throw new Error("pack 元数据无效"); process.stdout.write(m[0].integrity)' "$RUNNER_TEMP/ui-package/pack-metadata.json")"
          test "$LOCAL_INTEGRITY" = "$PACK_INTEGRITY" || { echo "❌ tarball 与 pack metadata 的 sha512 不一致"; exit 1; }

          resolve_remote_tag() {
            local ref_json object_type object_sha tag_json depth=0
            ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
            object_type="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.object?.type??""))' "$ref_json")"
            object_sha="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.object?.sha??""))' "$ref_json")"
            while [ "$object_type" = "tag" ]; do
              depth=$((depth + 1))
              [ "$depth" -le 8 ] || { echo "❌ 标签注解链超过 8 层" >&2; return 1; }
              tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.object?.type??""))' "$tag_json")"
              object_sha="$(node -e 'const r=JSON.parse(process.argv[1]); process.stdout.write(String(r.object?.sha??""))' "$tag_json")"
            done
            [ "$object_type" = "commit" ] && [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "❌ 远端标签未解析到精确 commit" >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          TAG_SHA_BEFORE="$(resolve_remote_tag)"
          test "$TAG_SHA_BEFORE" = "$RELEASE_SHA" || {
            echo "❌ 远端标签已偏离 verify-and-preflight 固定提交，拒绝创建或修改 Release"
            exit 1
          }

          RELEASE_JSON="$RUNNER_TEMP/release.json"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isImmutable,isPrerelease,targetCommitish,assets > "$RELEASE_JSON" 2>/dev/null; then
            echo "已找到 Release，进入幂等核验"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --draft --latest=false \
              --title "WorkLoom 三端基座 v${VERSION}" \
              --notes "由受保护 production 环境发布；制品经基座全门禁、标签/main 祖先证明与 sha512 完整性校验。"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isImmutable,isPrerelease,targetCommitish,assets > "$RELEASE_JSON"
          fi

          IS_IMMUTABLE="$(node -e 'const fs=require("fs"); process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1])).isImmutable===true))' "$RELEASE_JSON")"
          IS_DRAFT="$(node -e 'const fs=require("fs"); process.stdout.write(String(JSON.parse(fs.readFileSync(process.argv[1])).isDraft===true))' "$RELEASE_JSON")"
          if [ "$IS_IMMUTABLE" = "true" ]; then
            test "$IS_DRAFT" = "false" || { echo "❌ 不可变 Release 不得处于草稿状态"; exit 1; }
            echo "已发布 Release 不可变；只读核验，不重复 edit"
          else
            # 任何可变 Release（包括历史上已公开者）先收回草稿，再检查或上传资产。
            # 因此错误同名资产不会在失败窗口继续公开。
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true --latest=false
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,tagName,isDraft,isImmutable,isPrerelease,targetCommitish,assets > "$RELEASE_JSON"
            node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); if(r.isImmutable||!r.isDraft) throw new Error("可变 Release 必须先进入草稿状态")' "$RELEASE_JSON"
          fi

          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); const tag=process.argv[2]; if(r.tagName!==tag||r.isPrerelease) throw new Error("Release 必须绑定精确稳定标签且不得为预发布"); const tgz=(r.assets??[]).filter((a)=>a.name?.endsWith(".tgz")); if(tgz.length>1) throw new Error("Release 不得包含多个 tgz 制品")' "$RELEASE_JSON" "$RELEASE_TAG"
          ASSET_COUNT="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); const n=process.argv[2]; process.stdout.write(String((r.assets??[]).filter((a)=>a.name===n).length))' "$RELEASE_JSON" "$EXPECTED_ASSET")"
          TGZ_COUNT="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); process.stdout.write(String((r.assets??[]).filter((a)=>a.name?.endsWith(".tgz")).length))' "$RELEASE_JSON")"
          if [ "$TGZ_COUNT" -eq 1 ]; then
            test "$ASSET_COUNT" -eq 1 || { echo "❌ Release 已存在错误命名的 tgz 制品"; exit 1; }
          else
            test "$TGZ_COUNT" -eq 0
            test "$IS_IMMUTABLE" = "false" || { echo "❌ 不可变 Release 缺少预期制品，无法原地恢复"; exit 1; }
            gh release upload "$RELEASE_TAG" "$TARBALL" --repo "$GITHUB_REPOSITORY"
          fi

          REMOTE_DIR="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXPECTED_ASSET" --dir "$REMOTE_DIR"
          test -f "$REMOTE_DIR/$EXPECTED_ASSET"
          REMOTE_INTEGRITY="$(node -e 'const fs=require("fs"),c=require("crypto"); process.stdout.write(`sha512-${c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`)' "$REMOTE_DIR/$EXPECTED_ASSET")"
          test "$REMOTE_INTEGRITY" = "$LOCAL_INTEGRITY" || { echo "❌ Release 已存在同版本异内容制品，拒绝 rollout"; exit 1; }
          cmp -s "$TARBALL" "$REMOTE_DIR/$EXPECTED_ASSET" || { echo "❌ Release 制品未通过逐字节核验"; exit 1; }

          TAG_SHA_PREPUBLISH="$(resolve_remote_tag)"
          test "$TAG_SHA_PREPUBLISH" = "$RELEASE_SHA" || {
            echo "❌ 资产装配期间远端标签发生漂移；Release 保持草稿并拒绝公开"
            exit 1
          }
          if [ "$IS_IMMUTABLE" = "false" ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

          RELEASE_LIST_JSON="$RUNNER_TEMP/release-list.json"
          FINAL_IS_IMMUTABLE="$IS_IMMUTABLE"
          verify_public_release() {
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable,isPrerelease,assets > "$RELEASE_JSON" || return 1
            FINAL_IS_IMMUTABLE="$(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); if(typeof r.isImmutable!=="boolean") throw new Error("Release 缺少 isImmutable 状态"); process.stdout.write(String(r.isImmutable))' "$RELEASE_JSON")" || return 1
            node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); const tag=process.argv[2],asset=process.argv[3]; if(r.tagName!==tag||r.isDraft||r.isPrerelease) throw new Error("Release 最终状态必须公开且非预发布"); const tgz=(r.assets??[]).filter((a)=>a.name?.endsWith(".tgz")); const exact=tgz.filter((a)=>a.name===asset); if(tgz.length!==1||exact.length!==1) throw new Error("Release 最终 tgz 资产必须唯一且精确命名")' "$RELEASE_JSON" "$RELEASE_TAG" "$EXPECTED_ASSET" || return 1
            FINAL_REMOTE_DIR="$(mktemp -d)" || return 1
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$EXPECTED_ASSET" --dir "$FINAL_REMOTE_DIR" || return 1
            test -f "$FINAL_REMOTE_DIR/$EXPECTED_ASSET" || return 1
            FINAL_REMOTE_INTEGRITY="$(node -e 'const fs=require("fs"),c=require("crypto"); process.stdout.write(`sha512-${c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`)' "$FINAL_REMOTE_DIR/$EXPECTED_ASSET")" || return 1
            [ "$FINAL_REMOTE_INTEGRITY" = "$LOCAL_INTEGRITY" ] || return 1
            cmp -s "$TARBALL" "$FINAL_REMOTE_DIR/$EXPECTED_ASSET" || return 1
            gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isLatest,isDraft,isImmutable > "$RELEASE_LIST_JSON" || return 1
            node -e 'const fs=require("fs"); const rs=JSON.parse(fs.readFileSync(process.argv[1])); const tag=process.argv[2]; const match=rs.filter((r)=>r.tagName===tag); if(match.length!==1||match[0].isDraft||match[0].isLatest!==false) throw new Error("UI Release 必须唯一、公开且不得抢占仓库 latest")' "$RELEASE_LIST_JSON" "$RELEASE_TAG" || return 1
            TAG_SHA_AFTER="$(resolve_remote_tag)" || return 1
            [ "$TAG_SHA_AFTER" = "$RELEASE_SHA" ] || return 1
          }

          rollback_public_release() {
            if [ "$FINAL_IS_IMMUTABLE" = "false" ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true --latest=false || return 1
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isImmutable,isPrerelease,assets > "$RELEASE_JSON" || return 1
              node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1])); if(!r.isDraft) throw new Error("最终证明失败后的可变 Release 必须恢复为草稿")' "$RELEASE_JSON" || return 1
            else
              echo "❌ 不可变 Release 最终证明失败，无法自动恢复；需要人工阻断处理" >&2
            fi
          }

          if ! verify_public_release; then
            if ! rollback_public_release; then
              echo "❌ Release 最终证明失败且自动恢复草稿失败，需要人工阻断处理" >&2
            fi
            echo "❌ Release 公开后的状态、资产、latest 或标签证明失败，拒绝 rollout"
            exit 1
          fi
          echo "✅ GitHub Release 稳定制品已发布并通过 sha512/逐字节核验：$EXPECTED_ASSET"

  rollout-after-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ui-v')
    needs: [verify-and-preflight, publish-github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.verify-and-preflight.outputs.release-sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: 固定复算不可变制品的 npm CLI
        run: npm install --global --ignore-scripts npm@11.6.2
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile

      - name: 从 GitHub Release 核验自动发布的不可变 UI 制品
        env:
          STABLE_VERSION: ${{ needs.verify-and-preflight.outputs.release-version }}
        run: node sync/ui-upgrade-pr.mjs --verify-artifact --version "$STABLE_VERSION"

      - name: 提示使用本地受控凭据分波升级
        env:
          STABLE_VERSION: ${{ needs.verify-and-preflight.outputs.release-version }}
        run: |
          set -euo pipefail
          echo "::notice title=等待本地逐仓升级::GitHub Release 稳定制品已验真；Actions 不保存跨仓 PAT。"
          echo "稳定版本：$STABLE_VERSION。请按 W1→W5 使用本地受控凭据执行同一升级器，并逐仓验证后创建 PR。" >> "$GITHUB_STEP_SUMMARY"

  continue-rollout:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollout'
    needs: verify-and-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ needs.verify-and-preflight.outputs.release-sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: 固定复算不可变制品的 npm CLI
        run: npm install --global --ignore-scripts npm@11.6.2
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: 从 GitHub Release 核验手动 rollout 的不可变 UI 制品
        env:
          STABLE_VERSION: ${{ needs.verify-and-preflight.outputs.release-version }}
        run: node sync/ui-upgrade-pr.mjs --verify-artifact --version "$STABLE_VERSION"
      - name: 按严格波次继续创建独立升级 PR
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          STABLE_VERSION: ${{ needs.verify-and-preflight.outputs.release-version }}
          ROLLOUT_WAVE: ${{ inputs.wave }}
          ROLLOUT_REPOSITORIES: ${{ inputs.repositories }}
          REPORT_PATH: ${{ runner.temp }}/ui-rollout.json
        run: |
          set -euo pipefail
          test -n "${SYNC_TOKEN:-}" || { echo "❌ 缺少最小权限短期 SYNC_TOKEN"; exit 1; }
          ARGS=(--rollout --version "$STABLE_VERSION" --report "$REPORT_PATH")
          [ -n "$ROLLOUT_WAVE" ] && ARGS+=(--wave "$ROLLOUT_WAVE")
          [ -n "$ROLLOUT_REPOSITORIES" ] && ARGS+=(--repos "$ROLLOUT_REPOSITORIES")
          node sync/ui-upgrade-pr.mjs "${ARGS[@]}"
      - name: 留存本波次 rollout 结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-rollout-${{ inputs.stable_version }}-${{ inputs.wave || 'automatic' }}
          path: ${{ runner.temp }}/ui-rollout.json
          if-no-files-found: warn
          retention-days: 30
