name: ui-base-release

on:
  push:
    tags:
      - "ui-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只验证并预演行业仓升级，不发布或开 PR"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify-publish-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workloom
          POSTGRES_DB: workloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      DATABASE_URL: postgres://postgres:workloom@localhost:5432/workloom
      DATABASE_APP_URL: postgres://workloom_app:workloom_dev_app@localhost:5432/workloom
      DATABASE_GATEWAY_URL: postgres://workloom_gateway:workloom_dev_gateway@localhost:5432/workloom
      APP_DB_PASSWORD: workloom_dev_app
      GATEWAY_DB_PASSWORD: workloom_dev_gateway
      JWT_SECRET: ui-release-gate-secret
      LLM_PROVIDER: mock
      IM_DRIVER: mock
      RUN_DB_TESTS: "1"
      TOOL_UNVERIFIED_RATE: "0"
      RELEASE_WORKSPACE_ID: ws-aipm-demo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: 稳定行业包发布签名与生产验签
        if: startsWith(github.ref, 'refs/tags/ui-v')
        env:
          BUNDLE_SIGNING_PRIVATE_KEY: ${{ secrets.BUNDLE_SIGNING_PRIVATE_KEY }}
          BUNDLE_SIGNING_KEY_ID: ${{ vars.BUNDLE_SIGNING_KEY_ID || 'workloom-release-v1' }}
        run: |
          test -n "$BUNDLE_SIGNING_PRIVATE_KEY" || { echo "❌ 缺少 BUNDLE_SIGNING_PRIVATE_KEY，拒绝稳定发布"; exit 1; }
          pnpm bundle:release
          test -s build/bundle-trust.json || { echo "❌ 独立 Bundle 公钥环未生成"; exit 1; }
          pnpm projections:generate
      - run: pnpm product:verify && pnpm bundle:governance && pnpm projections:check
      - run: pnpm ui:governance
      - run: pnpm -C packages/industry-contract test && pnpm -C packages/industry-contract build
      - run: pnpm -C packages/ui test && pnpm -C packages/ui build
      - run: node --test scripts/verify-ui-consumer.test.mjs sync/base-sync.test.mjs sync/set-ui-version.test.mjs sync/ui-upgrade-pr.test.mjs

      - name: 基座数据库、全场景与三端生产门禁
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm db:seed:aipm
          BUNDLE_DIR=bundles/hotel pnpm db:seed
          pnpm suite
          pnpm -C apps/web build
          pnpm -C apps/webb build
          pnpm -C apps/webc build
          pnpm exec playwright install --with-deps chromium
          pnpm ui:e2e

      - name: 发布前核心链路门禁
        run: |
          pnpm -C apps/server start > "$RUNNER_TEMP/workloom-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/health >/dev/null
          pnpm release:gate

      - name: 校验 tag、稳定清单与包版本一致
        if: startsWith(github.ref, 'refs/tags/ui-v')
        run: |
          VERSION="${GITHUB_REF_NAME#ui-v}"
          node -e 'const fs=require("fs"); const v=process.argv[1]; const p=JSON.parse(fs.readFileSync("packages/ui/package.json")); const m=JSON.parse(fs.readFileSync("sync/base-capabilities.json")); if(p.version!==v||m.ui.latestStableVersion!==v) throw new Error(`版本不一致: tag=${v}, package=${p.version}, stable=${m.ui.latestStableVersion}`)' "$VERSION"

      - name: 发布稳定 UI 制品
        if: startsWith(github.ref, 'refs/tags/ui-v')
        run: pnpm -C packages/ui publish --no-git-checks

      - name: 为现有行业仓创建升级 PR
        if: startsWith(github.ref, 'refs/tags/ui-v')
        run: node sync/ui-upgrade-pr.mjs

      - name: 手动预演升级计划
        if: github.event_name == 'workflow_dispatch'
        run: node sync/ui-upgrade-pr.mjs --validate-only
