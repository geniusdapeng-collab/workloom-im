# ============================================================
# WorkLoom IM · 基座能力父→子升级 PR（base-sync）
#
# 自动触发：仅接收 main push 对应的 ci-gate 成功事件，并检出该次门禁的精确 SHA。
# 自动行为：逐仓生成固定命名的升级分支和可审计 PR；永不直推、永不自动合并 main。
# 手动触发：只允许 dry-run，用于核对同步范围，不能绕过 ci-gate。
# 无凭据：强制 dry-run，不产生任何下游写操作。
# ============================================================
name: base-sync-upgrade-pr

on:
  workflow_run:
    workflows: ["ci-gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-sync-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  sync-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出已通过门禁的精确基座提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 为全部行业仓生成升级 PR
        id: sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BASE_SYNC_GATE_STATUS: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || 'manual-dry-run' }}
          BASE_SYNC_GATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          BASE_SYNC_GATE_URL: ${{ github.event_name == 'workflow_run' && format('https://github.com/{0}/actions/runs/{1}', github.repository, github.event.workflow_run.id) || '' }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发只执行 dry-run，不能绕过 ci-gate。"
            EXTRA_ARGS="--dry-run"
          elif [ -z "$SYNC_TOKEN" ]; then
            echo "未配置 SYNC_TOKEN，强制降级为 dry-run；不会推分支或创建 PR。"
            EXTRA_ARGS="--dry-run"
          fi
          node sync/base-sync.mjs push --base . --json $EXTRA_ARGS | tee /tmp/base-sync-report.json

      - name: 同步报告（Job Summary）
        if: always()
        run: |
          echo "## WorkLoom IM 基座升级 PR 报告" >> "$GITHUB_STEP_SUMMARY"
          echo "- 基座提交：$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- 自动写入前提：main 的 ci-gate 成功且 SHA 精确匹配" >> "$GITHUB_STEP_SUMMARY"
          echo "- 下游策略：只推独立升级分支并创建 PR；禁止直推或自动合并 main" >> "$GITHUB_STEP_SUMMARY"
          echo "- 同步范围：sync/base-scope.json（行业 Bundle、主题、投影和种子数据除外）" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/base-sync-report.json ]; then cat /tmp/base-sync-report.json >> "$GITHUB_STEP_SUMMARY"; else echo '{"status":"未生成报告"}' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
