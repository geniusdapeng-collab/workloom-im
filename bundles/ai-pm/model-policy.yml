# AI 产品经理行业包 · 模型档位策略（沿用 L0-L3 体系，V3 扩展模型侧场景）
tiers:
  L0: { use: 闲聊与兜底, model: local-small }
  L1: { use: 情报聚合/聚类/日报骨架, model: cost-efficient }
  L2: { use: PRD 起草/竞品报告/周报正文, model: mid-tier }
  L3: { use: 考试院阅卷/编制生成/威胁评级终审/eval评判与judge校准, model: flagship }
scene_policy:
  industry-radar: L1
  review-miner: L1
  metric-digest: L1
  prd-forge: L2
  competitor-scan: L2
  release-notes: L2
  github-pulse: L1
  meeting-digest: L2
  eval-judge: L3          # 锁旗舰禁降级——judge 失准=整个评测体系失效
  wizard-staffing: L3
  # —— V3 新增场景 ——
  eval-forge: L2          # eval 集生成（案例+golden answer+rubric）
  badcase-harvest: L1     # badcase 挖掘与归因初筛
  model-scout: L2         # 新模型试跑与三轴选型报告
  prompt-regression: L2   # prompt 新旧版回归 diff
  judge-calibration: L3   # judge 一致率校准，锁旗舰禁降级
  finetune-tracker: L2    # 微调四问评估与训后对比
  kb-fresh: L1            # 知识保鲜巡检
  learning-digest: L2     # 学习周刊聚合研判
  redteam-scan: L2        # 对抗测试执行
