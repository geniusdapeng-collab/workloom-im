include:
  - scripts/delivery/cnb.yml
  - scripts/delivery/bootstrap-cnb.yml

# WorkLoom 织元 · CNB 云原生构建闸门
#
# 2026-09-17 随仓库迁移到 CNB 落地：把原 GitHub Actions `ci.yml`（ci-gate）的闸门
# 等价迁移为 CNB 流水线，作为保护分支 main 的必需状态检查。
#
# 与 GitHub 版的差异（受 CNB 能力边界约束，README/§13 有登记）：
#   - CNB services 只支持 docker / vscode，没有 GH Actions 的 service containers；
#     因此 DB 闸门用 pgvector/pgvector:pg17 作为流水线镜像，在容器内直接拉起 PostgreSQL 17。
#   - 三端 Playwright 响应式/视觉/无障碍已进入独立 ui-gate，作为 main 必需状态检查。
#   - 桌面安装包发布已迁入 CNB（见文件末尾 `desktop-release`）：签名/公证密钥与自托管
#     mac/windows 构建节点未就绪时 fail-closed；`.github/workflows/*` 仅保留为发布策略事实源。

.static-gate: &static_gate
  name: static-gate
  docker:
    image: node:24.19.0-bookworm
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    TOOL_UNVERIFIED_RATE: "0"
  stages:
    - name: 依赖安装（frozen lockfile）
      script: |
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
        # @workloom/ui 的 dist 不入库；typecheck/三端构建消费其类型与产物前必须先构建
        # （否则新增导出在缓存 dist 上不可见——0.1.8 易用性批次 static-gate 实测）
        pnpm -C packages/ui build

    - name: 增量秘密扫描（自检 + 范围扫描）
      script: |
        set -eu
        node scripts/secret-scan.mjs --self-test
        BASE_SHA="${CNB_BEFORE_SHA:-}"
        HEAD_SHA="$(git rev-parse HEAD)"
        if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          node scripts/secret-scan.mjs --range "$MERGE_BASE" "$HEAD_SHA" --acceptance-manifest sync/base-scope.json
        else
          echo "无可用 base sha（如首次推送），仅执行自检与全量扫描"
          node scripts/secret-scan.mjs --range "$HEAD_SHA" "$HEAD_SHA" --acceptance-manifest sync/base-scope.json
        fi

    - name: 协议门禁（提交规范 + 并发冲突）
      script: |
        set -eu
        node --test scripts/ci/protocol-rules.test.mjs scripts/tools/fleet-rules.test.mjs scripts/tools/experiment-rules.test.mjs
        node scripts/tools/experiment-guard.mjs --self-test
        node scripts/tools/experiment-guard.mjs --check
        node scripts/ci/verify-commit-msg.mjs --self-test
        node scripts/ci/verify-lock-conflict.mjs --self-test
        node scripts/ci/verify-commit-msg.mjs
        node scripts/ci/verify-lock-conflict.mjs

    - name: 开源组件清单一致性（oss-watch）
      script: |
        set -eu
        # 依赖变更（package.json / pnpm-lock.yaml / requirements.txt）必须同步刷新清单；
        # 未刷新即红灯：node scripts/oss-inventory.mjs --write 后一并提交。
        node --test scripts/oss-inventory.test.mjs scripts/oss-watch.test.mjs
        pnpm oss:check

    - name: 桌面运行时锁与载荷边界
      script: |
        set -eu
        # 直接用 node 调执行体，避免 pnpm 的 verify-deps-before-run 在 CI 触发
        # 模块目录清理（无 TTY 时 ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY → 闸门假失败）。
        node scripts/runtime-deps-lock.mjs verify
        for target in darwin:arm64 darwin:x64 win32:x64; do
          platform="${target%%:*}"
          arch="${target##*:}"
          stage="$(mktemp -d "/tmp/workloom-runtime-${platform}-${arch}.XXXXXX")"
          node scripts/runtime-deps-lock.mjs stage "$stage" --os "$platform" --cpu "$arch"
        done
        node --test scripts/product-runtime.test.mjs scripts/payload-policy.test.mjs scripts/pack-nm-merge.test.mjs scripts/runtime-deps-lock.test.mjs

    - name: typecheck 全包
      script: |
        set -eu
        pnpm -r --if-present typecheck

    - name: 产品身份与三端 UI 治理
      script: |
        set -eu
        pnpm product:verify
        pnpm bundle:governance:test
        pnpm bundle:governance
        pnpm projections:check
        pnpm ui:governance
        pnpm -C packages/industry-contract test
        pnpm -C packages/industry-contract build
        pnpm -C packages/ui test
        pnpm -C packages/ui build

    - name: 供应链与发布策略门禁
      script: |
        set -eu
        pnpm test:action-trust
        pnpm test:release-policy
        pnpm test:release-assets
        pnpm test:reset-safety
        # MC-201 防复发：README/客户文档承诺的安装包名必须与发布产线（INSTALLERS）和 CNB 发布流水线一致
        node scripts/desktop-artifact-naming.mjs

    - name: 基座同步与客户端接入门禁
      script: |
        set -eu
        node --test scripts/verify-ui-consumer.test.mjs sync/base-sync.test.mjs sync/direct-push.test.mjs sync/client-foundation.test.mjs sync/set-ui-version.test.mjs sync/ui-upgrade-pr.test.mjs sync/fanout-rules.test.mjs sync/fanout-safety.test.mjs sync/merge-sync-prs.test.mjs
        node --test scripts/delivery/*.test.mjs
        node --test scripts/acceptance/lib/profile-contract.test.mjs scripts/acceptance/profile-check.test.mjs scripts/acceptance/outcome.test.mjs scripts/acceptance/fleet-run.test.mjs scripts/acceptance/lib/environment-safety.test.mjs scripts/acceptance/lib/outcome-contract.test.mjs scripts/acceptance/lib/live/budget.test.mjs scripts/acceptance/lib/live/live-truth.test.mjs scripts/acceptance/lib/live/providers.test.mjs scripts/acceptance/lib/live/usage.test.mjs scripts/acceptance/lib/live/audit.test.mjs scripts/acceptance/lib/live/providers-http.test.mjs scripts/acceptance/lib/live/dsh-process.test.mjs scripts/acceptance/lib/live/live-cli-wire.test.mjs scripts/acceptance/lib/live/product.test.mjs scripts/acceptance/lib/live/media-negative.test.mjs scripts/acceptance/lib/live/live-cli.test.mjs
        node --test scripts/capability-status.test.mjs scripts/tools/provision-safety.test.mjs scripts/ui-release-registration.test.mjs
        node --test apps/desktop/electron/bootstrap.test.cjs scripts/desktop-bootstrap-db.test.mjs

    - name: 持续交付与不可变发布回归
      script: |
        set -eu
        node --test scripts/delivery/queue.test.mjs scripts/tools/task.test.mjs scripts/tools/provision-safety.test.mjs scripts/cnb-release-publish.test.mjs

    - name: 三端生产构建
      script: |
        set -eu
        pnpm -C apps/web build
        pnpm -C apps/webb build
        pnpm -C apps/webc build

.db-gate: &db_gate
  name: db-gate
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
  env:
    # DB 连接串与角色口令不写死在这里（会被基座增量秘密扫描拦截为 credential-in-url）：
    # 统一从 .env.example 派生的 .env 读取，见「迁移 + 种子」与各测试阶段开头的 set -a / . ./.env
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    RUN_DB_TESTS: "1"
    TOOL_UNVERIFIED_RATE: "0"
    RELEASE_WORKSPACE_ID: ws-aipm-demo
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        apt-get install -y -qq curl xz-utils ca-certificates git >/dev/null
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        node -v
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
        # 同 static-gate：@workloom/ui dist 不入库，三端构建前必须先构建
        pnpm -C packages/ui build

    - name: 四项专属 PostgreSQL 回归（独立 Unix socket + 旧数据升级）
      script: |
        set -eu
        pnpm -C packages/industry-contract build
        node --test scripts/test-owned-pg-contract.test.mjs
        node scripts/test-owned-pg.mjs --repo base

    # server 侧的任务专属契约需要各自私有的 Unix 集群与哨兵：泛化 server 阶段用
    # WORKLOOM_GENERIC_DB_CI=1 把它们移出发现面，这个阶段就是那条排除的补偿执行路径。
    # 它不是可选件——契约测试会断言它存在、且不继承泛化开关、不裁剪用例清单。
    - name: server 专属 PostgreSQL 契约（独立 Unix socket）
      script: |
        set -eu
        REPORT_DIR="$(mktemp -d /tmp/wl-owned-server-report-XXXXXX)"
        node scripts/test-owned-server-pg.mjs --report-dir "$REPORT_DIR"
        echo "owned server PG receipts: $REPORT_DIR"

    - name: 启动 PostgreSQL 17 + pgvector
      script: |
        set -eu
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"
          chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start"
        for i in $(seq 1 60); do
          if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
          sleep 1
        done
        pg_isready -h localhost -p 5432 -U postgres
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
        psql -h localhost -p 5432 -U postgres -d workloom -tAc "select current_database();"

    - name: 迁移 + 种子（H-1 完整率 100%）
      script: |
        set -eu
        cp .env.example .env
        set -a; . ./.env; set +a
        pnpm db:migrate
        pnpm db:seed:aipm
        pnpm db:seed:aipm:verify-idempotence
        BUNDLE_DIR=bundles/hotel pnpm db:seed
        BUNDLE_DIR=bundles/hotel pnpm db:seed

    - name: 哈希链全库验证
      script: |
        set -eu
        pnpm db:verify-chain

    - name: 基座单元与集成测试（DB 集成全开）
      script: |
        set -a; . ./.env; set +a
        set -eu
        pnpm -C packages/shared test
        WORKLOOM_GENERIC_DB_CI=1 pnpm -C packages/base test
        pnpm -C packages/runtime test

    - name: server 契约与 E2E
      env:
        # 双作用域契约用例需要显式工作区/租户（来自同阶段迁移 + 种子）；缺失时这些用例会
        # 主动 fail closed（而非静默跳过），因此必须与种子实际写入的 workspace/tenant 对齐：
        # ws-yunqi → tenant-demo（酒店示例）、ws-aipm-demo → demo（ai-pm 示例）。
        SERVICE_C_TEST_WORKSPACE_ID: ws-yunqi
        SERVICE_C_TEST_TENANT_ID: tenant-demo
        RELEASE_WORKSPACE_ID: ws-aipm-demo
        RELEASE_TENANT_ID: demo
      script: |
        set -a; . ./.env; set +a
        set -eu
        # 四套专属 PG 契约（aipm.snapshot / devtools.cancel / devtools.thread /
        # secretary.approval）要求任务专属私有集群与哨兵，通用 db-gate 不提供；
        # 本开关把它们交给专属 runner 阶段，避免在通用发现面 fail closed。
        # 与 packages/base 同一约定。
        WORKLOOM_GENERIC_DB_CI=1 pnpm -C apps/server test

    - name: 全场景套件
      script: |
        set -a; . ./.env; set +a
        set -eu
        pnpm suite

# ui-gate：三端响应式/视觉/无障碍门禁。
# 2026-09-18 起 Linux 视觉基线已在同一 CNB 镜像内重生成并入仓，故转为必需检查（不再 allowFailure）。
.ui-gate: &ui_gate
  name: ui-gate
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
      - /cnb-cache/ms-playwright:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    TOOL_UNVERIFIED_RATE: "0"
    RUN_DB_TESTS: "1"
    RELEASE_WORKSPACE_ID: ws-aipm-demo
    PLAYWRIGHT_BROWSERS_PATH: /cnb-cache/ms-playwright
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        apt-get install -y -qq curl xz-utils ca-certificates git >/dev/null
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile

    - name: 启动 PostgreSQL 17 并迁移种子
      script: |
        set -eu
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"; chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start"
        for i in $(seq 1 60); do
          if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
          sleep 1
        done
        pg_isready -h localhost -p 5432 -U postgres
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
        cp .env.example .env
        set -a; . ./.env; set +a
        pnpm db:migrate
        pnpm db:seed:aipm
        BUNDLE_DIR=bundles/hotel pnpm db:seed

    - name: 三端构建
      script: |
        set -eu
        pnpm -C apps/web build
        pnpm -C apps/webb build
        pnpm -C apps/webc build

    - name: 安装 Playwright Chromium
      script: |
        set -eu
        pnpm exec playwright install --with-deps chromium

    - name: 媒体真实性（实际解码与 live CLI 证据）
      script: |
        set -eu
        node --test scripts/acceptance/lib/live/media-decoder.test.mjs scripts/acceptance/lib/live/live-cli-browser.test.mjs

    - name: 三端响应式、视觉与无障碍门禁
      script: |
        set -eu
        set -a; . ./.env; set +a
        pnpm ui:e2e

# TEMP（T-2026-0929-0200）：Linux 视觉基线重生成流水线——本轮 UI 修复（数字职场遇阻/请示共存、
# 夜班出征入口、紧急制动接线）使 PC 参考截图变化，需在 CNB 同镜像内跑 `pnpm ui:e2e:update`
# 重生成 `*-linux.png` 并回推分支（依据 docs/cnb-migration-playbook.md §视觉基线）。
# 基线重生成完成后本条应在同分支内删除，恢复 ui-gate 只读基线语义。
.ui-baseline: &ui_baseline
  name: ui-baseline
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
      - /cnb-cache/ms-playwright:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    TOOL_UNVERIFIED_RATE: "0"
    RUN_DB_TESTS: "1"
    RELEASE_WORKSPACE_ID: ws-aipm-demo
    PLAYWRIGHT_BROWSERS_PATH: /cnb-cache/ms-playwright
    UI_BASELINE_BRANCH: task/T-2026-0929-0200
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        apt-get install -y -qq curl xz-utils ca-certificates git >/dev/null
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
    - name: 启动 PostgreSQL 17 并迁移种子
      script: |
        set -eu
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"; chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start" || true
        for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1 && break; sleep 1; done
        pg_isready -h localhost -p 5432 -U postgres
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
        cp .env.example .env
        set -a; . ./.env; set +a
        pnpm db:migrate
        pnpm db:seed:aipm
        BUNDLE_DIR=bundles/hotel pnpm db:seed
    - name: 三端构建
      script: |
        set -eu
        pnpm -C apps/web build
        pnpm -C apps/webb build
        pnpm -C apps/webc build
    - name: 安装 Playwright Chromium
      script: |
        set -eu
        pnpm exec playwright install --with-deps chromium
    - name: 诊断 + 重生成 Linux 基线并回推分支
      script: |
        set -eu
        set -a; . ./.env; set +a
        # 先原样跑一次门禁并把输出落盘（Linux 上的失败原因需要带回仓库才能离线分析）
        mkdir -p outputs/diagnostics/ui-e2e
        (pnpm ui:e2e > outputs/diagnostics/ui-e2e/e2e-linux.log 2>&1) || true
        cp -R test-results/ui outputs/diagnostics/ui-e2e/test-results 2>/dev/null || true
        # 更新基线（用例断言若因基线差异失败不阻断本次生成）
        pnpm ui:e2e:update > outputs/diagnostics/ui-e2e/update.log 2>&1 || true
        git config user.name "cnb-ui-baseline"
        git config user.email "ui-baseline@cnb.cool"
        git add tests/ui/workloom-clients.spec.ts-snapshots
        git add -f outputs/diagnostics/ui-e2e
        if git diff --cached --quiet; then
          echo "无基线变化（可能与平台/字体无关）"
          exit 0
        fi
        git commit -q -m "test(ui): 重生成视觉基线（排雷 T-2026-0929-0200 界面变更）[T-2026-0929-0200]"
        node --input-type=module -e '
          import {spawnSync} from "node:child_process";
          import {gitAuthenticationEnvironment,redactCredentials,requireToken} from "./scripts/tools/cnb-api.mjs";
          const branch=process.env.UI_BASELINE_BRANCH;
          if(!/^task\/T-[0-9]{4}-[0-9]{4}-[0-9]{4}$/.test(branch??"")) throw new Error("UI_BASELINE_BRANCH 必须为任务分支");
          const token=requireToken();
          const run=spawnSync("git",["push","origin",`HEAD:refs/heads/${branch}`],{encoding:"utf8",timeout:60000,env:gitAuthenticationEnvironment(token)});
          if(run.error||run.status!==0) throw new Error(redactCredentials(`基线分支推送失败：${run.error?.code??run.stderr}`,token));
        '

.ui-release: &ui_release
  name: ui-release
  # 页面手动/API 调用均须显式传 RELEASE_EXPECTED_SHA=<已审查并合入的准确 SHA>。
  # 缺失时在任何构建/上传前失败；不再从当前 main 的 CNB_BRANCH_SHA 推测发布来源。
  lock:
    key: workloom-delivery-release-ui
    expires: 14400
    wait: true
    timeout: 60
  docker:
    image: node:24.19.0-bookworm
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
  env:
    UI_VERSION: "0.1.20"
  stages:
    - name: 构建并打包 @workloom/ui
      script: |
        set -eu
        node scripts/delivery/release-source.mjs
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
        mkdir -p dist
        # 制品必须与 rollout（sync/ui-upgrade-pr.mjs#packTaggedUiArtifact）逐字节同源：
        # 那里固定「pnpm run prepack + npm pack --ignore-scripts」，npm pack 会归一 mtime，
        # 因此跨机器可复现；`pnpm pack` 保留工作树 mtime，同尺寸不同哈希，会让 rollout 的
        # 三方核对（本地复算 == 登记 SRI == Release 下载字节）永远失败（DEF：0.1.5 实测）。
        pnpm -C packages/ui run prepack
        (cd packages/ui && npm pack --ignore-scripts --json --pack-destination /workspace/dist > /workspace/dist/npm-pack.json)
        ls -l /workspace/dist
        ls -l /workspace/dist
        # 制品自证：包版本必须等于 UI_VERSION，并记录**本次上传字节**的 sha512。
        # 该摘要随后写回 sync/base-capabilities.json 并由同一次发布打标签 —— 消灭
        # “标签先于 integrity” 的时序缺口（此前标签指向的提交里只有预打包占位值，
        # 客户端基座通道 verify-source 会 fail-close，见 DEF-P1-0023）。
        node -e '
          const fs=require("fs"),{createHash}=require("crypto");
          const ver=process.env.UI_VERSION;
          const asset=`workloom-ui-${ver}.tgz`;
          const buf=fs.readFileSync(`/workspace/dist/${asset}`);
          const pkg=JSON.parse(fs.readFileSync("packages/ui/package.json","utf8"));
          if(pkg.version!==ver) throw new Error(`packages/ui 版本 ${pkg.version} 与 UI_VERSION ${ver} 不一致`);
          const digest="sha512-"+createHash("sha512").update(buf).digest("base64");
          fs.writeFileSync("/workspace/dist/release-metadata.json", JSON.stringify({version:ver,asset,size:buf.length,sha512:digest},null,2));
          console.log("artifact", asset, buf.length, digest);
        '
    - name: 核对已受审登记并创建不可变稳定标签
      script: |
        set -eu
        # main 中的真实 sha512 必须先由评审 + 必需门禁通过的 PR 登记。
        # 缺少登记时硬阻断；本发布任务不能直推 main、强改标签或替代评审。
        node scripts/ui-release-registration.mjs /workspace/dist/release-metadata.json /workspace/dist/release-commit.txt
    - name: 发布到 CNB Release
      script: |
        set -eu
        node scripts/cnb-release-publish.mjs --tag "ui-v${UI_VERSION}" --create \
          --body "WorkLoom 织元共享 UI 制品（已受审登记，固定 SHA 与字节）" \
          "/workspace/dist/workloom-ui-${UI_VERSION}.tgz"

# 基座 → 子仓 fanout（云端自动更新的主通道）
#
# 职责：把 workloom-im 的根级受控资产（全景认知 / 开发协议 / AGENTS 受控区块 / 同步登记）
# 的最新版本，开成每个子仓里的一条 `sync/base-*` 同步 PR。
# 合并由 scripts/delivery/cnb.yml 中独立的可信 main 执行器承担；fanout 故障不跳过合并。
# `sync/merge-sync-prs.mjs` 仅派发仓级执行器，不再拥有第二条直接合并路径。携带运行时代码的
# `-full` 波次与代码类 PR 走 §9.5 代码车道（必需检查 + 独立 AI 审查 + 交接/冷却期 +
# 无风险阻断标签，同仓每轮串行合并一条）。AGENTS/协议/同步器/验收执行器等治理资产
# 同样接受完整 AI 审查，不等待人工点击。人保留叫停 / 回滚 / 业务高风险裁决权。
#
# 跨仓前提（一次性）：CNB「组织设置 → 仓库管控 → 允许定时任务跨仓操作」。
# 未开启时定时任务会以“权限不足”告警收尾（不红），可改用 API 触发
# （调用者令牌自带跨仓权限）或本地兜底：~/.codex/skills/workloom-context/scripts/fleet-cloud-sync.sh
.base-sync-fanout: &base_sync_fanout
  name: base-sync-fanout
  docker:
    image: node:24.19.0-bookworm
  env:
    BASE_SYNC_MODE: required-only
  stages:
    - name: 准备 Node.js 运行时
      script: |
        set -eu
        corepack enable >/dev/null 2>&1 || true
        node -v
        git --version

    - name: 舰队 fanout（只对真漂移子仓开同步 PR）
      script: |
        set -eu
        MODE="${BASE_SYNC_MODE:-required-only}"
        DRY=""
        if [ "${BASE_SYNC_DRY_RUN:-0}" = "1" ]; then DRY="--dry-run"; fi
        # shellcheck disable=SC2086
        node sync/fanout-cnb.mjs --mode "$MODE" $DRY --tolerate-scope-error --json > /tmp/fanout.json
        cat /tmp/fanout.json

# 桌面安装包发布（CNB 侧通道，MC-202）
#
# 事实源在 CNB：GitHub 账号已失效（WORKLOOM_PRODUCT_CONTEXT §9.1），
# `.github/workflows/desktop-production-release.yml` 仅作为**发布策略事实源**保留
# （product.manifest.json#release.workflow、release-publisher-policy 与命名门禁仍按它校验），
# 桌面安装包的实际构建与发布在本流水线完成：
#   ① desktop-release-preflight（SaaS Linux）：发布输入、运行时资产锁、发布策略与
#      「文档承诺产物名 == 产线 INSTALLERS」一致性自检（MC-201 同源漂移防复发）；
#   ② desktop-release-macos（自托管 mac 节点）：签名 Bundle → 投影/产品校验/三端构建 → 载荷装配 →
#      electron-builder dmg（arm64 / x64）→ 拆包验收（payload/公钥环/签名+公证票据）→ 上传候选资产；
#   ③ desktop-release-windows（自托管 windows 节点）：同源 PG 运行时 → 载荷装配 → NSIS exe →
#      拆包验收（win-unpacked 载荷归档 + 首启冒烟）→ 上传候选资产；
#   ④ desktop-release-finalize（SaaS Linux）：await 上游完成后回读 CNB Release 候选字节逐字节复核
#      sha512，再产出 WorkLoom-SHA512SUMS.txt 与 WorkLoom-release-manifest.json。
#
# 前置（组织侧一次性，缺任一项即 fail-closed，不产出未签名/半套制品）：
#   · 接入自托管 mac / windows 构建节点（组织设置 → 构建节点；tags 见各 job）；
#   · 在 CNB 仓库密钥注入 BUNDLE_SIGNING_PRIVATE_KEY / MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD /
#     APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID / WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD / CNB_TOKEN。
# 现状登记：桌面签名与公证密钥未配置（BLK-B-01-003），预检会明确列出缺项并拒绝继续。
.desktop-release-preflight: &desktop_release_preflight
  name: desktop-release-preflight
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  docker:
    image: node:24.19.0-bookworm
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
  env:
    DESKTOP_RELEASE_VERSION: v0.0.0
  stages:
    - name: 发布输入与密钥前置（fail-closed）
      script: |
        set -eu
        node scripts/delivery/release-source.mjs
        VERSION="${DESKTOP_RELEASE_VERSION:-}"
        echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
          echo "必须用 env DESKTOP_RELEASE_VERSION=vX.Y.Z 触发桌面发布（当前：'${VERSION}'）"; exit 1; }
        missing=""
        for key in CNB_TOKEN BUNDLE_SIGNING_PRIVATE_KEY MAC_CSC_LINK MAC_CSC_KEY_PASSWORD \
                   APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
          eval "value=\${$key:-}"
          [ -n "$value" ] || missing="$missing $key"
        done
        if [ -n "$missing" ]; then
          echo "桌面发布通道未就绪：缺少签名/公证/发布凭据 →$missing"
          echo "登记：BLK-B-01-003（桌面签名与公证 secrets 未配置）。配齐后重跑 api_trigger_desktop_release。"
          echo "拒绝产出未签名安装包——制品必须可验签、可公证后再对外发布。"
          exit 1
        fi
        echo "发布版本 $VERSION"
    - name: 运行时资产锁 / 发布策略 / 命名一致性
      script: |
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
        node scripts/runtime-deps-lock.mjs verify
        node --test scripts/desktop-workflow-path.test.mjs scripts/desktop-release-policy.test.mjs \
          scripts/release-publisher-policy.test.mjs scripts/runtime-deps-lock.test.mjs
        node scripts/desktop-artifact-naming.mjs
    - name: resolve
      type: cnb:resolve
      options:
        key: desktop-release-preflight

.desktop-release-macos: &desktop_release_macos
  name: desktop-release-macos
  # 自托管 mac 构建节点（dmg 需 hdiutil/codesign/notarytool，SaaS 节点是 Linux 容器，无法代跑）
  runner:
    namespace: group
    tags:
      - mac
      - arm64
  env:
    VERSION: v0.0.0
    VITE_DEMO_WORKSPACE: ai-pm-demo
    VITE_DEMO_MEMBER: MEM-001
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  stages:
    - name: await preflight
      type: cnb:await
      options:
        key: desktop-release-preflight
    - name: 依赖 + 签名 Bundle + 投影/产品校验 + web 构建
      script: |
        set -eu
        node scripts/delivery/release-source.mjs
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm install --frozen-lockfile
        test -n "${BUNDLE_SIGNING_PRIVATE_KEY:-}" || { echo "缺少 BUNDLE_SIGNING_PRIVATE_KEY，拒绝生成生产安装包"; exit 1; }
        pnpm bundle:release
        test -s build/bundle-trust.json || { echo "独立 Bundle 公钥环未生成"; exit 1; }
        pnpm projections:generate
        pnpm product:verify
        pnpm bundle:governance
        pnpm projections:check
        node --test apps/desktop/electron/bootstrap.test.cjs scripts/desktop-bootstrap-db.test.mjs
        pnpm exec vitest run apps/web/src/voice/VoiceEngine.test.ts
        pnpm -C apps/web build
    - name: 载荷装配 + DMG（arm64 / x64）+ 拆包验收
      script: |
        set -eu
        test -n "${MAC_CSC_LINK:-}" && test -n "${MAC_CSC_KEY_PASSWORD:-}" || { echo "缺少 macOS Developer ID 签名证书，拒绝对外发行"; exit 1; }
        test -n "${APPLE_ID:-}" && test -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && test -n "${APPLE_TEAM_ID:-}" || { echo "缺少 Apple 公证凭据，拒绝对外发行"; exit 1; }
        export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
        retry() { local attempt=1; until "$@"; do [ "$attempt" -ge 3 ] && return 1; echo "下载失败，第 $((attempt + 1))/3 次重试"; attempt=$((attempt + 1)); sleep 8; done; }
        for arch in arm64 x64; do
          bash scripts/pack-electron-payload.sh --platform mac --arch "$arch" --version "$VERSION"
          retry pnpm exec electron-builder --mac dmg --"$arch" --publish never -c.extraMetadata.version="${VERSION#v}"
        done
        for dir in release/mac-arm64 release/mac; do
          APP="$(find "$dir" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          [ -n "$APP" ] || continue
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose --type exec "$APP"
          xcrun stapler validate "$APP"
          RES="$APP/Contents/Resources"
          test -f "$RES/payload.tar.gz" || { echo "拆包验收失败：payload.tar.gz 未进包（$APP）"; exit 1; }
          test -s "$RES/bundle-trust.json" || { echo "拆包验收失败：独立 Bundle 公钥环未进包（$APP）"; exit 1; }
          tar -tzf "$RES/payload.tar.gz" > /tmp/wl-pkg-list.txt
          grep -q "runtime/node_modules/tsx/package.json" /tmp/wl-pkg-list.txt || { echo "拆包验收失败：归档内缺 tsx"; exit 1; }
          grep -q "nats/nats-server" /tmp/wl-pkg-list.txt || { echo "拆包验收失败：归档内缺 nats"; exit 1; }
          node apps/desktop/electron/bootstrap.cjs --smoke --resources "$RES" --support "/tmp/wl-smoke-$(basename "$dir")"
          echo "拆包验收通过：$APP"
        done
        # 封存：改名到对外恒定名并写出平台清单（与遗留发布通道逐字段同口径）
        node scripts/desktop-candidate-stage.mjs --platform mac --out dist-desktop --version "$VERSION" --signing signed
    - name: 上传 macOS 候选资产到 CNB Release
      script: |
        set -eu
        node scripts/cnb-release-publish.mjs --tag "$VERSION" --create \
          --body "WorkLoom 织元桌面安装包（CNB 构建；macOS arm64/x64 已验签+公证）" \
          dist-desktop/WorkLoom-mac-arm64.dmg dist-desktop/WorkLoom-mac-x64.dmg dist-desktop/desktop-macos-manifest.json
    - name: resolve
      type: cnb:resolve
      options:
        key: desktop-release-macos

.desktop-release-windows: &desktop_release_windows
  name: desktop-release-windows
  # RELEASE_EXPECTED_SHA 来自整次触发的 env，所有 mac/Windows/finalize Job 共用；手动触发也必须显式传入。
  # 自托管 windows 构建节点（NSIS/Authenticode 需 Windows 工具链）；bash 步骤依赖 Git for Windows（CNB 文档列为自托管节点必装）
  runner:
    namespace: group
    tags:
      - windows
  env:
    VERSION: v0.0.0
    VITE_DEMO_WORKSPACE: ai-pm-demo
    VITE_DEMO_MEMBER: MEM-001
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  stages:
    - name: await preflight
      type: cnb:await
      options:
        key: desktop-release-preflight
    - name: 同源 PG 运行时 + 依赖 + 签名 Bundle + 投影/构建
      script: |
        # 注：自托管 Windows 节点上 stage script 默认走 PowerShell（CNB 文档），bash 步骤显式经 Git for Windows 执行
        $ErrorActionPreference = "Stop"
        node scripts/delivery/release-source.mjs
        if ($LASTEXITCODE -ne 0) { throw "冻结发布源码校验失败" }
        powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-pgvector-win.ps1
        if ($LASTEXITCODE -ne 0) { throw "pgvector/PG 运行时编译失败" }
        bash -lc @'
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm install --frozen-lockfile
        test -n "${BUNDLE_SIGNING_PRIVATE_KEY:-}" || { echo "缺少 BUNDLE_SIGNING_PRIVATE_KEY，拒绝生成生产安装包"; exit 1; }
        pnpm bundle:release
        test -s build/bundle-trust.json || { echo "独立 Bundle 公钥环未生成"; exit 1; }
        pnpm projections:generate
        pnpm product:verify
        pnpm bundle:governance
        pnpm projections:check
        pnpm -C apps/web build
        '@
        if ($LASTEXITCODE -ne 0) { throw "依赖/签名 Bundle/投影构建失败" }
    - name: 载荷装配 + NSIS 安装包 + 拆包验收
      script: |
        $ErrorActionPreference = "Stop"
        if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw "缺少 Windows 代码签名证书，拒绝对外发行" }
        bash scripts/pack-electron-payload.sh --platform win --arch x64 --version $env:VERSION
        if ($LASTEXITCODE -ne 0) { throw "载荷装配失败" }
        $version = $env:VERSION.TrimStart("v")
        pnpm exec electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=$version"
        if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败" }
        $resources = "release/win-unpacked/resources"
        if (-not (Test-Path "$resources/payload.tar.gz")) { throw "拆包验收失败：payload.tar.gz 未进包" }
        if (-not (Test-Path "$resources/payload/PAYLOAD_VERSION")) { throw "拆包验收失败：PAYLOAD_VERSION 未进包" }
        if (-not (Test-Path "$resources/bundle-trust.json")) { throw "拆包验收失败：独立 Bundle 公钥环未进包" }
        bash -lc @'
        set -eu
        tar -tzf release/win-unpacked/resources/payload.tar.gz > /tmp/wl-pkg-list.txt
        grep -q "runtime/node_modules/tsx/package.json" /tmp/wl-pkg-list.txt || { echo "归档内缺 tsx"; exit 1; }
        grep -q "nats/nats-server" /tmp/wl-pkg-list.txt || { echo "归档内缺 nats"; exit 1; }
        '@
        if ($LASTEXITCODE -ne 0) { throw "拆包验收失败：载荷归档内容不完整" }
        node apps/desktop/electron/bootstrap.cjs --smoke --resources $resources --support "$env:TEMP/wl-win-smoke"
        if ($LASTEXITCODE -ne 0) { throw "win-unpacked 载荷首启冒烟失败" }
        node scripts/desktop-candidate-stage.mjs --platform win --out dist-desktop --version $env:VERSION --signing signed
        if ($LASTEXITCODE -ne 0) { throw "候选封存失败（产物数量/命名与发布策略不一致）" }
    - name: 上传 Windows 候选资产到 CNB Release
      script: |
        $ErrorActionPreference = "Stop"
        node scripts/cnb-release-publish.mjs --tag $env:VERSION --create --body "WorkLoom 织元桌面安装包（CNB 构建；Windows x64 已 Authenticode 签名）" dist-desktop/WorkLoom-win-x64.exe dist-desktop/desktop-windows-manifest.json
        if ($LASTEXITCODE -ne 0) { throw "候选资产上传/回读复核失败" }
    - name: resolve
      type: cnb:resolve
      options:
        key: desktop-release-windows

.desktop-release-finalize: &desktop_release_finalize
  name: desktop-release-finalize
  runner:
    tags: cnb:arch:amd64
    cpus: 8
  docker:
    image: node:24.19.0-bookworm
  env:
    VERSION: v0.0.0
  stages:
    - name: await 平台候选制品
      type: cnb:await
      options:
        key: [desktop-release-macos, desktop-release-windows]
    - name: 回读候选字节 + 汇总校验表与发布清单
      script: |
        set -eu
        node scripts/delivery/release-source.mjs
        mkdir -p dist/desktop
        cd dist/desktop
        for asset in WorkLoom-mac-arm64.dmg WorkLoom-mac-x64.dmg WorkLoom-win-x64.exe desktop-macos-manifest.json desktop-windows-manifest.json; do
          curl -fsSL "https://cnb.cool/workloom-ai/workloom-im/-/releases/download/${VERSION}/${asset}" -o "$asset"
        done
        node -e '
          const fs=require("fs"),c=require("crypto");
          const sourceSha=process.env.RELEASE_EXPECTED_SHA;
          if(!/^[a-f0-9]{40,64}$/.test(sourceSha||"")) throw new Error("发布清单要求显式 RELEASE_EXPECTED_SHA");
          const specs=[["desktop-macos-manifest.json",["WorkLoom-mac-arm64.dmg","WorkLoom-mac-x64.dmg"]],["desktop-windows-manifest.json",["WorkLoom-win-x64.exe"]]];
          const assets=[];
          for(const [manifestFile,names] of specs){
            const m=JSON.parse(fs.readFileSync(manifestFile,"utf8"));
            if(m.schemaVersion!==1||m.tag!==process.env.VERSION) throw new Error(`${manifestFile} 版本/标签不匹配`);
            for(const name of names){
              const b=fs.readFileSync(name);
              const digest=c.createHash("sha512").update(b).digest("hex");
              const row=(m.assets??[]).filter((a)=>a.name===name);
              if(row.length!==1||row[0].size!==b.length||row[0].sha512!==digest) throw new Error(`${name} 与平台清单不一致（候选字节可能在传输中损坏）`);
              assets.push({name,size:b.length,sha512:digest});
            }
          }
          fs.writeFileSync("WorkLoom-release-manifest.json",JSON.stringify({schemaVersion:1,product:"workloom-desktop",tag:process.env.VERSION,sourceSha,channel:"cnb",assets},null,2)+"\n");
          fs.writeFileSync("WorkLoom-SHA512SUMS.txt",assets.map((a)=>`${a.sha512}  ${a.name}`).join("\n")+"\n");
          console.log("汇总校验表：",assets.map((a)=>a.name).join("、"));
        '
        cd -
        node scripts/cnb-release-publish.mjs --tag "$VERSION" \
          --body "WorkLoom 织元桌面安装包（CNB 构建；sha512 校验表 + 发布清单）" \
          dist/desktop/WorkLoom-SHA512SUMS.txt dist/desktop/WorkLoom-release-manifest.json

main:
  push:
    - *static_gate
    - *db_gate
    - *ui_gate

"**":
  pull_request:
    - *static_gate
    - *db_gate
    - *ui_gate

# 手动/定时触发的流水线（合并进同一个 $ 兜底键，避免重复顶层键导致配置解析失败）
$:
  # 桌面安装包正式发布（CNB 侧通道，MC-202）：
  #   触发：event=api_trigger_desktop_release，并以 env DESKTOP_RELEASE_VERSION=vX.Y.Z 指定版本；
  #   编排：preflight（Linux）→ mac/win 自托管节点构建 → finalize（Linux 回读复核 + 校验表）。
  #   前置：自托管 mac/windows 构建节点 + 桌面签名/公证密钥（缺任一项由 preflight/平台 job fail-closed）。
  api_trigger_desktop_release:
    - *desktop_release_preflight
    - *desktop_release_macos
    - *desktop_release_windows
    - *desktop_release_finalize
  # 发布共享 UI 制品：由 API 触发（event: api_trigger_ui_release），也可页面触发
  api_trigger_ui_release:
    - *ui_release
  # TEMP（T-2026-0929-0200）：Linux 视觉基线重生成（用完即删，见 .ui-baseline 注释）
  api_trigger_ui_baseline:
    - *ui_baseline
  # 基座 fanout（云端自动更新的主通道）：
  #   · API 触发：event=api_trigger_base_sync，可用 env 覆盖 BASE_SYNC_MODE（required-only|full）
  #     与 BASE_SYNC_DRY_RUN=1（只报告不落地）；
  #   · 每 30 分钟自愈一次（幂等：只对真漂移子仓开门，已有在途同步 PR 的子仓跳过）。
  api_trigger_base_sync:
    - *base_sync_fanout
  "crontab: */30 * * * *":
    - *base_sync_fanout

  # 每日舰队扫描（09:00 Asia/Shanghai；CNB crontab 使用 Asia/Shanghai 系统时区，最小间隔 5 分钟）：
  #   发现新的 WorkLoom 仓 → 开扫描任务卡 + 自动创建纳管 PR；门禁全绿后由 AI/合并器执行合并。
  "crontab: 0 9 * * *":
    - name: fleet-scan
      docker:
        image: node:24.19.0-bookworm
      env:
        FLEET_ORG: workloom-ai
        FLEET_BASE_REPO: workloom-ai/workloom-im
      stages:
        - name: 安装锁定的交付解析器
          script: |
            set -eu
            npm ci --prefix scripts/delivery/runtime --ignore-scripts --no-audit --no-fund
        - name: 扫描新仓并纳管
          script: |
            set -eu
            node scripts/tools/fleet-scan.mjs --self-test
            node scripts/tools/experiment-guard.mjs --check
            node scripts/tools/fleet-scan.mjs --org "$FLEET_ORG" --base-repo "$FLEET_BASE_REPO" --issue --provision

  # 每周开源组件上游扫描（周一 07:00 Asia/Shanghai；CNB crontab 用 Asia/Shanghai 时区）：
  #   全量刷新「当前版本 + 上游最新版本」清单与更新计划；有变化即开 chore/oss-watch-* PR。
  #   扫描只刷新事实；升级由 AI 按协议 §1/§9.5 执行（门禁全绿 + 串行 + 冷却期后合并），
  #   破坏性/大版本升级须在 PR 显著标注并按 §3 由独立 AI 检查迁移/回滚；人保留叫停与回滚权。
  "crontab: 0 7 * * 1":
    - name: oss-watch-weekly
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: 扫描上游最新版本并开刷新 PR
          script: |
            set -eu
            node scripts/oss-inventory.mjs --self-test
            node scripts/oss-watch-ci.mjs --exit-zero
